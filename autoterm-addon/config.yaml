name: Autoterm 5D
version: "1.0.0"
slug: autoterm5d
description: >-
  Controls an Autoterm 5D diesel heater and its comfort panel over UART,
  publishing live status and exposing start/stop/thermostat controls as
  Home Assistant entities via MQTT discovery.
url: https://github.com/sinise/autoterm-5d-control
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: services
boot: auto
uart: true
hassio_api: true
services:
  - mqtt:want
options:
  panel_port: /dev/ttyUSB1
  heater_port: /dev/ttyUSB3
  baud: 2400
  autodiscover_ports: false
  preheat_default_minutes: 30
  auto_target_default: 20.0
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  panel_port: str
  heater_port: str
  baud: int
  autodiscover_ports: bool
  preheat_default_minutes: int(1,600)
  auto_target_default: float(5,35)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
