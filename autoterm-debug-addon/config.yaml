name: Autoterm Heater Debug
version: "2.1.0"
slug: autoterm_heater_debug
description: >-
  Everything the Autoterm Heater add-on does, plus optional periodic
  extended telemetry (vendor diagnostic-mode) probing across 19 heater
  models, full raw traffic capture to a downloadable log, and sensors for
  every known extended field. For protocol reverse-engineering; not
  needed for normal day-to-day use.
url: https://github.com/sinise/autoterm-heater-control
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: services
boot: auto
uart: true
hassio_api: true
services:
  - mqtt:want
map:
  - config:rw
options:
  panel_port: /dev/ttyUSB1
  heater_port: /dev/ttyUSB3
  baud: 2400
  autodiscover_ports: false
  preheat_default_minutes: 30
  auto_target_default: 20.0
  prevent_freezing_target_default: 5.0
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  debug_mode_default: false
  debug_interval_seconds_default: 60
  capture_log_default: false
  capture_log_max_mb: 20
  heater_profile: autoterm_flow_5
schema:
  panel_port: str
  heater_port: str
  baud: int
  autodiscover_ports: bool
  preheat_default_minutes: int(1,600)
  auto_target_default: float(5,35)
  prevent_freezing_target_default: float(0,10)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  debug_mode_default: bool
  debug_interval_seconds_default: int(5,3600)
  capture_log_default: bool
  capture_log_max_mb: int(1,500)
  heater_profile: "list(14tc_10_molex|autoterm_air_2d|autoterm_air_4d|autoterm_air_8d|autoterm_air_9d|autoterm_flow_5|binar_5s_next|binar_5s|planar_2_with_flame_sensor|planar_2d|planar_2mk|planar_44d_s_p|planar_44mk|planar_4d_s_p|planar_4d|planar_8d_s_p|planar_9d|sputnik_2|sputnik_3)"
